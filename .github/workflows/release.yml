name: Release

# Cut a release by pushing a version tag:
#   npm run release            # optional: build and eyeball the tarballs locally first
#   git tag v0.1.0 && git push origin v0.1.0
#
# The workflow verifies, builds the tarballs from the tagged commit, and attaches them to a
# GitHub release so consumers can install them by URL.

on:
  push:
    tags:
      - "v*"

# `contents: write` is what lets the job create a release and upload assets with GITHUB_TOKEN.
# Without it the token is read-only and the publish step fails with 403.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Gate: 114 tests, including the Orion parity harness. Nothing is published from a tag whose
      # commit does not pass. Runs offline — every fixture is committed.
      - name: Verify
        run: npm run typecheck && npm test

      - name: Build release tarballs
        run: npm run release

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" release/*.tgz --clobber
